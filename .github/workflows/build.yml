name: Build and verify FIPS provider

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fips-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-contract:
    name: Version and checksum contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify source selection without network access
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate a release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

  container:
    name: Linux ${{ matrix.architecture }} (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            profile: defaults
          - runner: ubuntu-24.04-arm
            architecture: arm64
            profile: defaults
          - runner: ubuntu-24.04
            architecture: amd64
            profile: version-overrides
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build on the native architecture
        run: |
          set --
          if [ '${{ matrix.profile }}' = version-overrides ]; then
            set -- --build-arg OPENSSL_VERSION=openssl-4.1.0 \
                   --build-arg FIPS_OPENSSL_VERSION=openssl-3.0.9
          fi
          docker buildx build --load --progress=plain \
            --platform linux/${{ matrix.architecture }} \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label org.opencontainers.image.version="$GITHUB_SHA" \
            --tag openssl-fips:ci "$@" .
      - name: Verify runtime and failure behavior
        run: ./tests/run.sh openssl-fips:ci
      - name: Export the tested default image
        if: >-
          matrix.profile == 'defaults' && github.event_name == 'push' &&
          github.repository == 'xcapdevila/openssl-fips'
        run: docker save --output "$RUNNER_TEMP/image-linux-${{ matrix.architecture }}.tar" openssl-fips:ci
      - name: Retain the tested image for publication
        if: >-
          matrix.profile == 'defaults' && github.event_name == 'push' &&
          github.repository == 'xcapdevila/openssl-fips'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-linux-${{ matrix.architecture }}
          path: ${{ runner.temp }}/image-linux-${{ matrix.architecture }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  publish:
    name: Publish verified multi-platform image
    needs: [source-contract, container]
    if: github.event_name == 'push' && github.repository == 'xcapdevila/openssl-fips'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ghcr-openssl-fips
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      IMAGE: ghcr.io/xcapdevila/openssl-fips
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download tested images from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-linux-*
          merge-multiple: true
          path: ${{ runner.temp }}/tested-images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the tested images and assemble the manifest
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Upload first so the package exists before looking up an immutable alias.
          for architecture in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/tested-images/image-linux-$architecture.tar"
            platform_tag="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$architecture"
            docker tag openssl-fips:ci "$platform_tag"
            docker push "$platform_tag"
          done
          commit_tag="$IMAGE:sha-$GITHUB_SHA"
          if docker buildx imagetools inspect "$commit_tag" --format '{{json .Manifest}}' \
            > "$RUNNER_TEMP/commit-manifest.json" 2> "$RUNNER_TEMP/commit-inspect.log"; then
            # A rerun or release at an existing commit retains its first verified image.
            digest=$(jq -r .digest "$RUNNER_TEMP/commit-manifest.json")
            gh attestation verify "oci://$IMAGE@$digest" --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA"
            printf 'new-image=false\n' >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|not found' "$RUNNER_TEMP/commit-inspect.log"; then
            build_tag="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker buildx imagetools create --tag "$build_tag" \
              "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" \
              "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
            digest=$(docker buildx imagetools inspect "$build_tag" --format '{{json .Manifest}}' | jq -r .digest)
            printf 'new-image=true\n' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/commit-inspect.log" >&2
            exit 1
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$digest" --raw | \
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the multi-platform image provenance
        if: steps.images.outputs.new-image == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.images.outputs.digest }}
          push-to-registry: true
      - name: Publish the attested image aliases
        id: publish
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.images.outputs.digest }}
          NEW_IMAGE: ${{ steps.images.outputs.new-image }}
        run: |
          set -euo pipefail
          digest="$DIGEST"
          if [[ "$NEW_IMAGE" == true ]]; then
            docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE@$digest"
          fi
          if [[ "$REF" == refs/tags/* ]]; then
            for version_tag in "$IMAGE:$VERSION" "$IMAGE:${VERSION#v}"; do
              if docker buildx imagetools inspect "$version_tag" --format '{{json .Manifest}}' \
                > "$RUNNER_TEMP/version-manifest.json" 2> "$RUNNER_TEMP/version-inspect.log"; then
                existing=$(jq -r .digest "$RUNNER_TEMP/version-manifest.json")
                [[ "$existing" == "$digest" ]] || { printf 'Refusing to replace release image %s\n' "$version_tag" >&2; exit 1; }
              elif ! grep -Eiq 'manifest unknown|not found' "$RUNNER_TEMP/version-inspect.log"; then
                cat "$RUNNER_TEMP/version-inspect.log" >&2
                exit 1
              fi
            done
            docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:${VERSION#v}" "$IMAGE@$digest"
          elif [[ "$GITHUB_SHA" == "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" ]]; then
            # A slower old run must not move latest behind the current default branch.
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$digest"
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '## Container publication\n\n`%s@%s`\n\nFirst publication requires a one-time public visibility check; see docs/RELEASING.md.\n' \
            "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create the tagged release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ github.ref_name }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Create a release for the verified tag
        run: |
          set -euo pipefail
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes \
              --notes "Verified Linux AMD64 and ARM64 image: ghcr.io/xcapdevila/openssl-fips@$IMAGE_DIGEST"
          fi
